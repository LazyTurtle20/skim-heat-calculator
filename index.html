<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Interactive Heat Score Calculator</title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 20px; }\n        label { display: block; margin-bottom: 5px; }\n        input[type="number"] { margin-bottom: 10px; }\n        button { margin-top: 10px; }\n    </style>\n</head>\n<body>\n    <h1>Interactive Heat Score Calculator</h1>\n    <label for="tempInput">Enter Temperature (°C):</label>\n    <input type="number" id="tempInput" placeholder="Temperature...">\n    <label for="humidityInput">Enter Humidity (%):</label>\n    <input type="number" id="humidityInput" placeholder="Humidity...">\n    <button id="calculateBtn">Calculate Heat Score</button>\n    <h2 id="result">Heat Score: </h2>\n    <script>\n        document.getElementById('calculateBtn').addEventListener('click', function() {\n            const temp = parseFloat(document.getElementById('tempInput').value);\n            const humidity = parseFloat(document.getElementById('humidityInput').value);\n            if (!isNaN(temp) && !isNaN(humidity)) {\n                const heatScore = calculateHeatScore(temp, humidity);\n                document.getElementById('result').innerText = 'Heat Score: ' + heatScore;\n            } else {\n                alert('Please enter valid numbers.');\n            }\n        });\n        function calculateHeatScore(temp, humidity) {\n            return (temp + humidity - 10).toFixed(2); // Simplified formula\n        }\n    <\/script>\n</body>\n</html>

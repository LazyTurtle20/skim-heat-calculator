<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skim Heat Scoring Calculator</title>
</head>
<body>
    <h1>Interactive Skim Heat Scoring Calculator</h1>
    <label for="score">Enter your score:</label>
    <input type="number" id="score" placeholder="0" />
    <button id="calculate">Calculate Heat Score</button>
    <p id="result"></p>

    <script>
        document.getElementById('calculate').addEventListener('click', function() {
            const score = document.getElementById('score').value;
            let heatScore;

            // Example scoring logic
            if (score >= 90) {
                heatScore = 'Excellent';
            } else if (score >= 75) {
                heatScore = 'Good';
            } else if (score >= 50) {
                heatScore = 'Average';
            } else {
                heatScore = 'Poor';
            }

            document.getElementById('result').innerText = `Heat Score: ${heatScore}`;
        });
    <\/script>
</body>
</html>
